version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: terraguard_db
    restart: always

    environment:
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: terraguard123
      POSTGRES_DB: terraguard

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: